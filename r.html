<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Red Zone Resources</title>
<style>
:root{--ink:#1a1a1a;--muted:#5A6576;--bg:#F4F5F7;--card:#fff;--line:#E1E4E8;--rc:#C8102E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:max(16px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ar{font-family:"Geeza Pro","Noto Naskh Arabic","Segoe UI",Arial,sans-serif;font-size:18px;text-align:right}
.r-head{display:flex;gap:14px;align-items:center;border-bottom:4px solid var(--rc);padding-bottom:12px}
.r-head img{height:52px;background:#fff;border-radius:6px;padding:3px}
.r-head b{display:block;font-size:26px;color:var(--rc);line-height:1.15}
.r-head span{font-size:14px;color:var(--muted)}
.r-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.r-name{font-weight:700;font-size:19px}
.r-formula{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;background:#FFF4F5;border-left:5px solid #C8102E;padding:8px 12px;margin:8px 0;border-radius:4px}
.r-card p{margin:0 0 8px}
.r-ex{background:#F6F7F9;border-radius:8px;padding:10px 12px}
.r-ex ol{margin:6px 0;padding-left:24px}
.r-ans{font-weight:700;color:#1D6B43}
.r-intro{font-size:19px;margin:0}
.r-skill{font-size:22px;font-weight:800;display:flex;gap:10px;align-items:center;margin-top:8px}
.r-skill span{background:#1F5FAD;color:#fff;font-size:15px;padding:2px 10px;border-radius:5px;white-space:nowrap}
.r-big{background:#EAF1FB;border-radius:8px;padding:10px 12px;font-size:18px}
.r-step{display:grid;grid-template-columns:36px 1fr;gap:10px;font-size:19px;align-items:start;background:var(--card);border-radius:10px;padding:10px}
.r-step em{font-style:normal;width:32px;height:32px;border-radius:50%;background:#1F5FAD;color:#fff;display:grid;place-items:center;font-weight:700}
.r-step svg{max-width:100%}
.r-try{border:2px dashed #1F5FAD;border-radius:10px;padding:12px 14px;font-size:19px;background:var(--card)}
.r-hint{font-size:16px;color:var(--muted);margin-top:4px}
.r-line{display:none}
.r-answers{font-size:16px;background:var(--card);border-radius:10px;padding:10px 14px}
.r-answers b{display:block}
details.r-answers summary{cursor:pointer;font-weight:700}
.r-bar{display:flex;border:2px solid #222;height:34px;max-width:420px;margin:8px 0;background:#fff}
.r-bar i{flex:1;border-right:1px solid #222}.r-bar i:last-child{border-right:0}.r-bar i.on{background:#9DBDE8}
.r-cap{font-size:15px;color:var(--muted)}
.r-tbl{border-collapse:collapse;margin:8px 0;font-size:17px;background:#fff}
.r-tbl th,.r-tbl td{border:1px solid #999;padding:4px 10px}.r-tbl th{background:#EAF1FB}
.r-gl{width:100%;border-collapse:collapse;font-size:16px;background:var(--card)}
.r-gl th{background:#2E8B57;color:#fff;text-align:left;padding:8px;font-weight:600}
.r-gl th.ar{text-align:right}
.r-gl td{border:1px solid #ccc;padding:8px;vertical-align:top}
.r-blk{display:flex;flex-direction:column;gap:12px}
@media (max-width:600px){
  .r-gl,.r-gl tbody,.r-gl tr,.r-gl td{display:block;width:100%!important}
  .r-gl colgroup,.r-gl thead{display:none}
  .r-gl tr{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px;background:var(--card)}
  .r-gl td{border:0;padding:4px 6px}
}
.msg{background:var(--card);border-radius:12px;padding:20px;color:var(--muted)}
footer{margin-top:24px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function nlSvg(d){
  const min=Math.max(-20,Math.min(0,Math.round(+d.min||-5))),max=Math.min(20,Math.max(min+2,Math.round(+d.max||5)));
  const n=max-min,W=170,x=v=>8+(v-min)*(W-16)/n;
  let s=`<svg viewBox="0 0 ${W} 22" style="width:100%;max-width:${W}mm;display:block;margin:1.5mm 0"><line x1="3" y1="10" x2="${W-3}" y2="10" stroke="#222" stroke-width=".4"/><path d="M3 10 l2.4 -1.6 v3.2z M${W-3} 10 l-2.4 -1.6 v3.2z" fill="#222"/>`;
  for(let v=min;v<=max;v++)s+=`<line x1="${x(v)}" y1="8.2" x2="${x(v)}" y2="11.8" stroke="#222" stroke-width=".3"/><text x="${x(v)}" y="16.5" font-size="3.3" text-anchor="middle" font-family="Lexend,Arial" fill="#222">${v<0?"−"+(-v):v}</text>`;
  (Array.isArray(d.points)?d.points:[]).slice(0,6).forEach(p=>{const v=+p.value;if(!(v>=min&&v<=max))return;s+=`<circle cx="${x(v)}" cy="10" r="1.5" fill="#4B1D6B"/>`+(p.label?`<text x="${x(v)}" y="5.5" font-size="3" text-anchor="middle" font-family="Lexend,Arial" fill="#4B1D6B" font-weight="700">${esc(String(p.label).slice(0,14))}</text>`:"")});
  return s+"</svg>";
}
function diagram(d){
  if(!d||typeof d!=="object")return"";
  if(d.type==="numberline")return nlSvg(d);
  if(d.type==="bar"){const n=Math.max(1,Math.min(12,Math.round(+d.parts||4))),k=Math.max(0,Math.min(n,Math.round(+d.shaded||0)));
    return `<div class="r-bar">${Array.from({length:n},(_,i)=>`<i class="${i<k?"on":""}"></i>`).join("")}</div>${d.label?`<div class="r-cap">${esc(d.label)}</div>`:""}`}
  if(d.type==="table"&&Array.isArray(d.rows))return `<table class="r-tbl">${d.rows.slice(0,4).map((r,i)=>`<tr>${(Array.isArray(r)?r:[r]).slice(0,4).map(v=>i?`<td>${esc(v)}</td>`:`<th>${esc(v)}</th>`).join("")}</tr>`).join("")}</table>`;
  return"";
}
function resHeader(z,label,color){
  const c=z.content;
  return `<div class="r-head" style="--rc:${color}"><img src="${LOGO}" alt=""><div><b>${esc(label)}</b><span>Lessons ${esc(c.lessons)} · ${esc(c.title)}</span></div></div>`;
}
const uniqBy=(arr,f)=>{const seen=new Set();return (Array.isArray(arr)?arr:[]).filter(x=>{const k=String(f(x)||"").trim().toLowerCase();if(!k||seen.has(k))return false;seen.add(k);return true})};
function resBlocks(key,d,z){
  const B=[];const c=z.content;d={...d,items:uniqBy(d.items,x=>x.name),skills:uniqBy(d.skills,x=>x.name),words:uniqBy(d.words,x=>x.en),phrases:uniqBy(d.phrases,x=>x.en)};
  if(key==="formula"){
    (d.items||[]).forEach((it,i)=>B.push(`<div class="r-card"><div class="r-name">${i+1}. ${esc(it.name)}</div><div class="r-formula">${esc(it.formula)}</div><p>${esc(it.meaning)}</p>
      ${it.example?`<div class="r-ex"><b>Guided practice:</b> ${esc(it.example.question)}<ol>${(it.example.steps||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol><div class="r-ans">Answer: ${esc(it.example.answer)}</div></div>`:""}</div>`));
  }else if(key==="accom"){
    if(d.intro)B.push(`<p class="r-intro">${esc(d.intro)}</p>`);
    (d.skills||[]).forEach((sk,i)=>{
      const head=`<div class="r-skill"><span>Skill ${i+1}</span>${esc(sk.name)}</div>${sk.bigIdea?`<div class="r-big"><b>Big idea:</b> ${esc(sk.bigIdea)}</div>`:""}`;
      const steps=(sk.steps||[]).map((st,j)=>`<div class="r-step"><em>${j+1}</em><div>${esc(st.text)}${diagram(st.diagram)}</div></div>`);
      B.push(head+(steps[0]||""));steps.slice(1).forEach(x=>B.push(x));
      if(sk.tryIt)B.push(`<div class="r-try"><b>Try it:</b> ${esc(sk.tryIt.question)}<div class="r-hint">Hint: ${esc(sk.tryIt.hint||"")}</div><div class="r-line"></div></div>`);
    });
    const ans=(d.skills||[]).map((sk,i)=>sk.tryIt?`<li>Skill ${i+1}: ${esc(sk.tryIt.answer)}</li>`:"").join("");
    if(ans)B.push(`<div class="r-answers"><b>Answers to “Try it”</b><ol style="list-style:none;padding:0">${ans}</ol></div>`);
  }else{
    const words=d.words||[];
    for(let i=0;i<words.length;i+=4){
      B.push(`<table class="r-gl"><colgroup><col style="width:17%"><col style="width:30%"><col style="width:22%"><col style="width:31%"></colgroup>${i===0?'<thead><tr><th>Word</th><th>Meaning</th><th>Example</th><th dir="rtl" class="ar">الكلمة والمعنى</th></tr></thead>':""}<tbody>${words.slice(i,i+4).map(w=>`<tr><td><b>${esc(w.en)}</b></td><td>${esc(w.defEn)}</td><td>${esc(w.example)}</td><td dir="rtl" class="ar"><b>${esc(w.ar)}</b><br>${esc(w.defAr)}</td></tr>`).join("")}</tbody></table>`);
    }
    if((d.phrases||[]).length)B.push(`<div class="r-skill"><span>Say it</span>Sentence starters · بدايات الجمل</div><table class="r-gl">${d.phrases.map(p=>`<tr><td style="width:50%">${esc(p.en)}</td><td dir="rtl" class="ar">${esc(p.ar)}</td></tr>`).join("")}</table>`);
  }
  return B;
}

var LABELS={formula:["Formula Sheet","#C8102E"],accom:["Step by Step","#1F5FAD"],ell:["ELL Support","#2E8B57"]};
(function(){
  var app=document.getElementById("app");
  var q=new URLSearchParams(location.search),id=(q.get("l")||"").replace(/[^A-Za-z0-9_-]/g,""),k=q.get("k")||"";
  function fail(t){app.innerHTML='<div class="msg">'+esc(t)+'</div>'}
  if(!id||!LABELS[k])return fail("Scan a resource QR code on your Red Zone worksheet.");
  fetch(id+".json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(p){
    var d=p[k];if(!d)return fail("This resource isn’t ready yet. Ask your teacher.");
    var L=LABELS[k];document.title=(d.title||L[0]);
    var head='<div class="r-head" style="--rc:'+L[1]+'"><img src="'+LOGO+'" alt=""><div><b>'+esc(d.title||L[0])+'</b><span>Lessons '+esc(p.lessons)+' · '+esc(p.title)+'</span></div></div>';
    var blocks=resBlocks(k,d,{content:{title:p.title,lessons:p.lessons}});
    if(k==="accom")blocks=blocks.map(function(b){return b.indexOf('class="r-answers"')>-1?b.replace('<div class="r-answers"><b>','<details class="r-answers"><summary>').replace('</b>','</summary>').replace(/<\/div>$/,'</details>'):b});
    app.innerHTML=head+blocks.map(function(b){return '<div class="r-blk">'+b+'</div>'}).join("");
  }).catch(function(){fail("This resource isn’t online yet. Ask your teacher to upload the lesson pack.")});
})();
