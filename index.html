<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Red Zone</title>
<style>
  :root{--red:#C8102E;--ink:#17202B;--muted:#5A6576;--bg:#F4F5F7;--card:#fff;--line:#E1E4E8}
  @media (prefers-color-scheme:dark){:root{--ink:#E8EDF3;--muted:#A2ACBA;--bg:#0F141B;--card:#171E27;--line:#2A3340;--red:#FF5266}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
  main{max-width:680px;margin:0 auto}
  .badge{display:inline-block;background:var(--red);color:#fff;font-weight:800;letter-spacing:.06em;padding:4px 12px;border-radius:4px;font-size:15px}
  .sub{color:var(--muted);font-size:15px;margin:10px 0 0}
  h1{font-size:26px;line-height:1.2;margin:6px 0 18px}
  ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;font-size:20px}
  li b{flex:0 0 34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:17px}
  .empty{background:var(--card);border-radius:12px;padding:20px;color:var(--muted)}
  footer{margin-top:28px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<main id="app"><div class="empty">Scan a QR code on your Red Zone worksheet to see the steps or answers here.</div></main>
<footer>Red Zone · Dubai Schools Al Khawaneej</footer>
<script>
(function(){
  function decode(s){
    s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";
    var bin=atob(s),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function el(tag,text,cls){var e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}
  function render(){
    var app=document.getElementById("app"),h=location.hash.slice(1);
    if(!h)return;
    try{
      var d=decode(h);app.innerHTML="";
      app.appendChild(el("span",d.k==="A"?"ANSWERS":d.k==="H"?"HOW TO SOLVE":(d.k||"RED ZONE"),"badge"));
      if(d.s)app.appendChild(el("p",d.s,"sub"));
      app.appendChild(el("h1",d.h||""));
      var ol=el("ol");(d.l||[]).forEach(function(line,i){var li=el("li");li.appendChild(el("b",String(i+1)));li.appendChild(el("span",line));ol.appendChild(li)});
      app.appendChild(ol);document.title=(d.h||"Red Zone");
    }catch(e){app.innerHTML="";app.appendChild(el("div","This code could not be read. Ask your teacher for help.","empty"))}
  }
  window.addEventListener("hashchange",render);render();
})();
</script>
</body>
</html>
